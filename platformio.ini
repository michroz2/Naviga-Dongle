; ==========================================================
; Проект: Naviga Dongle
; Конфигурация PlatformIO
; ==========================================================
[platformio]
; Указываем дефолтную плату для сборки и прошивки
;default_envs = dongle_tbeam_v11 

; Если нужно, чтобы по умолчанию всегда собирались ОБЕ прошивки разом, 
; их можно перечислить через запятую:
; default_envs = dongle_tbeam_v11, dongle_t_energy_s3

; === БАЗОВЫЕ НАСТРОЙКИ (Общие для всех плат) ===
[env]
framework = arduino
monitor_speed = 115200
monitor_raw = yes

; Настройки разделов памяти (Partition Scheme)
; Meshtastic использует huge_app или кастомную таблицу, чтобы вместить Bluetooth стек
board_build.partitions = huge_app.csv

; --- Общие библиотеки ---
lib_deps =
    ; Драйвер LoRa (SX1262/SX1268 и др.)
    jgromes/RadioLib
    
    ; Легковесный стек Bluetooth (используется вместо Bluedroid)
    h2zero/NimBLE-Arduino
    
    ; Драйвер GPS
    mikalhart/TinyGPSPlus
    
    ; Драйвер OLED дисплея
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays

; --- Общие флаги компиляции ---
build_flags = 
    -D CORE_DEBUG_LEVEL=3          ; Уровень отладки (Info)

    ; === ОПТИМИЗАЦИЯ RADIOLIB (Вырезаем неиспользуемые чипы) ===
    -D RADIOLIB_EXCLUDE_CC1101
    -D RADIOLIB_EXCLUDE_RF69
    -D RADIOLIB_EXCLUDE_SX1231
    -D RADIOLIB_EXCLUDE_SX127X     ; Основной чип SX127x (у нас E22 / SX1268)
    -D RADIOLIB_EXCLUDE_RFM9X      ; Зависит от SX127X
    -D RADIOLIB_EXCLUDE_SX128X
    -D RADIOLIB_EXCLUDE_SI443X     ; Основной чип Si443x
    -D RADIOLIB_EXCLUDE_RFM2X      ; Зависит от SI443X
    -D RADIOLIB_EXCLUDE_NRF24
    -D RADIOLIB_EXCLUDE_LR11X0

    ; === ОПТИМИЗАЦИЯ ПРОТОКОЛОВ RADIOLIB ===
    -D RADIOLIB_EXCLUDE_APRS
    -D RADIOLIB_EXCLUDE_AX25
    -D RADIOLIB_EXCLUDE_MORSE
    -D RADIOLIB_EXCLUDE_RTTY
    -D RADIOLIB_EXCLUDE_SSTV
    -D RADIOLIB_EXCLUDE_PAGER
    -D RADIOLIB_EXCLUDE_HELLSCHREIBER
    -D RADIOLIB_EXCLUDE_AFSK
    -D RADIOLIB_EXCLUDE_BELL       ; Зависит от AFSK
    -D RADIOLIB_EXCLUDE_FSK4       
    -D RADIOLIB_EXCLUDE_EXTERNAL_RADIO


; ==========================================================
; Окружение 1: T-Beam v1.1 (Оригинальная плата)
; ==========================================================
[env:dongle_tbeam_v11]
platform = espressif32
board = ttgo-t-beam

; Наследуем общие библиотеки и добавляем управление питанием AXP2101
lib_deps =
    ${env.lib_deps}
    lewisxhe/XPowersLib            ; Критично для запуска T-Beam v1.1

; Наследуем общие флаги и добавляем специфичные для платы
build_flags = 
    ${env.build_flags}
    -D BOARD_T_BEAM_V11            ; Флаг для нашего configuration.h
    -D ARDUINO_USB_CDC_ON_BOOT=0   ; Обязательно 0 для T-Beam (иначе Serial не определен)


; ==========================================================
; Окружение 2: Lilygo T-Energy S3
; ==========================================================
[env:dongle_t_energy_s3]
platform = espressif32
board = esp32-s3-devkitc-1         ; Универсальный профиль для чипа ESP32-S3

; Библиотеки наследуются из базовой секции [env]. XPowersLib здесь не нужна.
lib_deps =
    ${env.lib_deps}

; Наследуем общие флаги и добавляем специфичные для платы
build_flags = 
    ${env.build_flags}
    -D BOARD_T_ENERGY_S3           ; Флаг для нашего configuration.h
    -D ARDUINO_USB_CDC_ON_BOOT=1   ; Важно: T-Energy S3 использует аппаратный USB CDC для вывода в Serial Monitor
